<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Ambient Now Playing</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="bg-wrap" aria-hidden="true">
        <div class="bg-layer" id="bg-a"></div>
        <div class="bg-layer" id="bg-b"></div>
        
        <div class="spotlight-container">
            <div class="spotlight s1"></div>
            <div class="spotlight s2"></div>
            <div class="spotlight s3"></div>
        </div>

        <div class="bg-vignette"></div>
        <div class="bg-noise"></div>
    </div>

    <div id="login-screen" class="glass-container">
        <h1 class="zune-text">Click "start" to authenticate.</h1>
        <button id="login-button" onclick="redirectToSpotify()">START</button>

        <div class="credit-footer">Vibe coded by Grant Hubert</div>
    </div>

    <div id="player-screen" style="display: none;">
        <div id="immersive-overlay-1" class="immersive-content">
            <div class="marquee-group">
                <div id="imm-track-1" class="imm-text song-title"></div>
                <div id="imm-artist-1" class="imm-text artist-name"></div>
                <div id="imm-album-1" class="imm-text album-title"></div>
            </div>
        </div>

        <div id="immersive-overlay-2" class="immersive-content">
            <div id="word-cloud-container"></div>
        </div>

        <div id="immersive-overlay-3" class="immersive-content">
            <div class="stacked-drift-container">
                <div class="drift-row row-1"><div id="drift-track" class="drift-text"></div></div>
                <div class="drift-row row-2"><div id="drift-artist" class="drift-text"></div></div>
                <div class="drift-row row-3"><div id="drift-album" class="drift-text"></div></div>
            </div>
        </div>

        <div id="immersive-overlay-4" class="immersive-content">
            <div class="vertical-stack-rotate">
                <div class="stack-line line-1"></div>
                <div class="stack-line line-2"></div>
                <div class="stack-line line-3"></div>
                <div class="stack-line line-4"></div>
                <div class="stack-line line-5"></div>
                <div class="stack-line line-6"></div>
                <div class="stack-line line-7"></div>
                <div class="stack-line line-8"></div>
                <div class="stack-line line-9"></div>
            </div>
        </div>

        <div class="zune-layout">
            <div class="art-section">
                <img id="track-img" src="" alt="Album Art" />
            </div>

            <div class="text-meta">
                <a id="track-link" target="_blank" style="text-decoration: none; color: inherit;">
                    <h1 id="track-title">NOTHING PLAYING</h1>
                </a>
                <a id="artist-link" target="_blank" style="text-decoration: none; color: inherit;">
                    <h2 id="track-artist">OPEN SPOTIFY</h2>
                </a>
            </div>
        </div>

        <div class="compliance-footer">
            <span>By using this app, you agree to our <a href="#" style="color: #1DB954;">Privacy Info</a>.</span>
            <span style="margin: 0 10px;">|</span>
            <span>To revoke access, visit <a href="https://www.spotify.com/account/apps/" target="_blank" style="color: #1DB954;">Spotify Apps</a>.</span>
        </div>

        <button id="fullscreen-button" onclick="toggleFullscreen()" aria-label="Toggle Fullscreen">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
